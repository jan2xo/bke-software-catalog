name: PR Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  publication-policy:
    name: Agent publication contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify intentional PREPRODUCTION publication policy
        shell: python
        run: |
          from pathlib import Path

          path = Path(".github/workflows/publish-agent-preproduction.yml")
          if not path.is_file():
              raise SystemExit("Agent PREPRODUCTION publication workflow is missing.")

          text = path.read_text(encoding="utf-8")

          required = [
              "workflow_dispatch:",
              "agent_source_sha:",
              "agent_certification_run_id:",
              "installer_artifact_id:",
              "expected_version:",
              "expected_sha256:",
              "expected_bytes:",
              "authorization:",
              "permissions:",
              "contents: write",
              "jan2xo/bke-licensing-agent",
              "installer / Required installer certification",
              "Required certification",
              "agent-installer-package",
              "actions/download-artifact@v4",
              "artifact-ids:",
              "AGENT_ARTIFACT_READ_TOKEN",
              "bke.agent-installer-package.v2",
              'status == "PREPRODUCTION"',
              "production_ready == false",
              'trust == "DISPOSABLE_PREPRODUCTION"',
              "PUBLISH_AGENT_PREPRODUCTION",
              "overwrite is forbidden",
              "prerelease: true",
              'make_latest: "false"',
              "gh release upload",
              "gh release download",
              "Published release SHA-256 does not match certified installer.",
              "Published release byte count does not match certified installer.",
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(
                  "Publication workflow is missing required policy tokens: "
                  + ", ".join(missing)
              )

          forbidden_triggers = [
              "\n  push:",
              "\n  pull_request:",
              "\n  workflow_run:",
              "\n  schedule:",
          ]
          present_triggers = [
              token.strip() for token in forbidden_triggers if token in text
          ]
          if present_triggers:
              raise SystemExit(
                  "Publication workflow gained an automatic trigger: "
                  + ", ".join(present_triggers)
              )

          forbidden_build_or_overwrite = [
              "git clone",
              "actions/setup-dotnet",
              "dotnet build",
              "dotnet publish",
              "msbuild",
              "ISCC.exe",
              "choco install",
              "--clobber",
              "release upload --clobber",
          ]
          present_forbidden = [
              token for token in forbidden_build_or_overwrite
              if token.lower() in text.lower()
          ]
          if present_forbidden:
              raise SystemExit(
                  "Catalog publication must consume certified bytes, not rebuild/overwrite: "
                  + ", ".join(present_forbidden)
              )

          if text.count("workflow_dispatch:") != 1:
              raise SystemExit(
                  "Publication workflow must have exactly one workflow_dispatch trigger."
              )

          print("Software Catalog Agent PREPRODUCTION publication policy: PASS")

  media-organizer-release-policy:
    name: Media Organizer PREPRODUCTION publication contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact-artifact beta publication stays manual and preproduction
        shell: python
        run: |
          from pathlib import Path
          path = Path(".github/workflows/publish-media-organizer-preproduction.yml")
          if not path.exists():
              raise SystemExit("Media Organizer publisher workflow missing.")
          text = path.read_text(encoding="utf-8")
          required = [
              "workflow_dispatch:", "source_sha:", "certification_run_id:",
              "certification_run_attempt:", "macos_artifact_id:",
              "expected_archive_sha256:", "windows_artifact_id:",
              "expected_windows_archive_sha256:", "beta_version:", "authorization:",
              '[[ "$GITHUB_REF" == "refs/heads/main" ]]',
              '[[ "$GITHUB_ACTOR" == "jan2xo" ]]',
              "PUBLISH_MEDIA_ORGANIZER_PREPRODUCTION",
              "MEDIA_ORGANIZER_ARTIFACT_READ_TOKEN",
              "jan2xo/bke-metadata-manager",
              ".github/workflows/desktop.yml",
              "Build and test (macos-latest)",
              "Build and test (windows-latest)",
              "Build and test (ubuntu-latest)",
              "Self-contained desktop build (osx-arm64)",
              "Self-contained desktop build (win-x64)",
              "ARCHIVE_SHA256", "WINDOWS_ARCHIVE_SHA256",
              "WINDOWS_ARTIFACT_ID", "EXPECTED_WINDOWS_ARTIFACT",
              "media-organizer-win-x64", "sha256sum --check",
              "Bke.MetadataManager.exe", "Avalonia.Win32.dll",
              "Windows artifact identity, same-run provenance",
              "bke.media-organizer-preproduction.v2",
              "BKE-Media-Organizer-Windows-x64.zip",
              "windows_signature_trust", "'UNSIGNED'",
              "and (.assets | length) == 4",
              "PREPRODUCTION", "production_ready",
              "AD_HOC_ONLY", "notarized", "apple_developer_id_signed",
              "prerelease: true", 'make_latest: "false"',
              "gh release upload", "gh release download",
              "Refuse any pre-existing release or Git tag",
              "published package SHA-256 drifted",
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit("Beta publisher missing policy tokens: " + ", ".join(missing))
          if text.count("workflow_dispatch:") != 1:
              raise SystemExit("Beta publication requires exactly one dispatch trigger.")
          for forbidden in ("\n  push:", "\n  pull_request:", "\n  schedule:", "\n  workflow_run:",
                            "actions/setup-dotnet", "dotnet publish", "dotnet build",
                            "--clobber", "release upload --clobber",
                            "PUBLISH_MEDIA_ORGANIZER_PRODUCTION"):
              if forbidden.lower() in text.lower():
                  raise SystemExit("Forbidden trigger, build or overwrite: " + forbidden)
          if "ARTIFACT_READ_TOKEN: " not in text:
              raise SystemExit("Artifact credential must be scoped to step environment.")
          if text.count("actions/artifacts/") < 4:
              raise SystemExit("Both platform artifacts must be checked and downloaded.")
          if text.count("sha256sum --check --status") < 2:
              raise SystemExit("Both platform archives need SHA-256 proof.")
          if text.count("gh release upload") != 1 or text.count("gh release download") != 1:
              raise SystemExit("Exactly one release publish and verification transaction is permitted.")
          if "WINDOWS_ARCHIVE_SHA256" not in text or "macOS app" not in text:
              raise SystemExit("Each platform must declare its signing trust clearly.")
          print("Media Organizer PREPRODUCTION publication guard: PASS")
